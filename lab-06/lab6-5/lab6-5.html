<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна №6 — Завдання 5: картка погоди</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather">

        <!-- Головна чорна картка (нижній шар) -->
        <div class="card">
            <div class="card-cloud"></div>   <!-- "хмара": напівпрозорий градієнт -->
            <div class="card-temp">17</div>
        </div>

        <!-- Стрілки навігації -->
        <div class="arrows">
            <span class="arrow">&larr;</span>
            <span class="arrow">&rarr;</span>
        </div>

        <!-- Прогноз на тиждень (з тінню, накладається на картку) -->
        <div class="forecast">
            <div class="day"><small>Mon</small>17°</div>
            <div class="day"><small>Tue</small>19°</div>
            <div class="day"><small>Wed</small>16°</div>
            <div class="day"><small>Thu</small>18°</div>
            <div class="day"><small>Fri</small>21°</div>
        </div>
    </div>
</body>
</html>
