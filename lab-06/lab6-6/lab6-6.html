<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна №6 — Завдання 6: попап</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <a class="header-link" href="#">Mail</a>
        <a class="header-link" href="#">Images</a>

        <div class="popup-wrap">
            <!-- Прихований checkbox: ЗАЛИШАЄТЬСЯ фокусованим (opacity:0, не display:none).
                 Перемикає попап. Має йти ПЕРЕД .popup-button та .popup -->
            <input class="popup-toggle" type="checkbox" id="popup-toggle" aria-label="Відкрити меню застосунків">
            <label class="popup-button" for="popup-toggle">&#9783;</label>

            <div class="popup">
                <!-- Другий checkbox: кнопка «More». Повинен бути ПЕРЕД .popup-content -->
                <input class="more-toggle" type="checkbox" id="more-toggle" aria-label="Показати більше">

                <!-- tabindex="0" — щоб можна було скролити стрілками -->
                <div class="popup-content" tabindex="0">
                    <a class="popup-item" href="#"><span class="popup-icon">📅</span>Calendar</a>
                    <a class="popup-item" href="#"><span class="popup-icon">✉️</span>Mail</a>
                    <a class="popup-item" href="#"><span class="popup-icon">📰</span>News</a>
                    <a class="popup-item" href="#"><span class="popup-icon">🗺️</span>Map</a>
                    <a class="popup-item" href="#"><span class="popup-icon">📁</span>Files</a>
                    <a class="popup-item" href="#"><span class="popup-icon">👤</span>Contacts</a>
                    <a class="popup-item" href="#"><span class="popup-icon">🌐</span>Translate</a>
                    <a class="popup-item" href="#"><span class="popup-icon">▶️</span>Videos</a>
                    <a class="popup-item" href="#"><span class="popup-icon">🔍</span>Search</a>

                    <!-- Додаткові іконки (3–10 шт.): видимі лише після натискання More -->
                    <div class="popup-extra">
                        <a class="popup-item" href="#"><span class="popup-icon">🖼️</span>Photos</a>
                        <a class="popup-item" href="#"><span class="popup-icon">🧩</span>Apps</a>
                        <a class="popup-item" href="#"><span class="popup-icon">📄</span>Documents</a>
                        <a class="popup-item" href="#"><span class="popup-icon">💬</span>Chat</a>
                        <a class="popup-item" href="#"><span class="popup-icon">🎓</span>Classroom</a>
                        <a class="popup-item" href="#"><span class="popup-icon">🔖</span>Collection</a>
                    </div>
                </div>

                <label class="popup-more" for="more-toggle">More</label>
            </div>
        </div>
    </header>
</body>
</html>
