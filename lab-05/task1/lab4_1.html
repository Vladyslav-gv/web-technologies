<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 1 — План подорожі</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Структура: div > h1 + ul(1-й рівень) > li > (span + ul(2-й рівень) > li > span) -->
    <div>
        <h1>План подорожі:</h1>

        <ul class="level-1">
            <li>
                <span>Підготовчий етап</span>
                <ul class="level-2">
                    <li class="phone"><span>Обрати маршрут</span></li>
                    <li class="ticket"><span>Квитки на літак</span></li>
                    <li class="bed"><span>Готель</span></li>
                    <li class="car"><span>Оренда авто</span></li>
                </ul>
            </li>
            <li>
                <span>Відпочинок</span>
                <ul class="level-2">
                    <li class="bar"><span>Бари</span></li>
                    <li class="casino"><span>Казино</span></li>
                    <li class="museum"><span>Музеї</span></li>
                    <li class="festival"><span>Фестивалі</span></li>
                </ul>
            </li>
        </ul>
    </div>
</body>
</html>
