<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Завдання 1: таблиця</title>
  <style type="text/css">
    table { border-collapse: collapse; width: 400px; }
    td { border: 2px solid #000; }  
    tr { width: 60px; height: 50px; }
    body { text-align: center; }
    table { margin: 0 auto; }
  </style>
</head>
<body>

  <table>
    <tr><td colspan="8" bgcolor="#2effd0"><br/></td></tr>
    <tr>
      <td rowspan="6" bgcolor="#ffffcc"><br/></td>
      <td colspan="6" bgcolor="#2effd0"><br/></td>
      <td rowspan="6" bgcolor="#ffffcc"><br/></td>
    </tr>
    <tr>
      <td rowspan="4" bgcolor="#ffffcc"><br/></td>
      <td colspan="4" bgcolor="#2effd0"><br/></td>
      <td rowspan="4" bgcolor="#ffffcc"><br/></td>
    </tr>
    <tr>
      <td rowspan="2" bgcolor="#ffffcc"><br/></td>
      <td bgcolor="#ff0000"><br/></td>
      <td bgcolor="#0000ff"><br/></td>
      <td rowspan="2" bgcolor="#ffffcc"><br/></td>
    </tr>
    <tr>
      <td bgcolor="#00ff00"><br/></td>
      <td bgcolor="#ffff00"><br/></td>
    </tr>
    <tr><td colspan="4" bgcolor="#2effd0"><br/></td></tr>
    <tr><td colspan="6" bgcolor="#2effd0"><br/></td></tr>
    <tr><td colspan="8" bgcolor="#2effd0"><br/></td></tr>
  </table>
</body>
</html>
